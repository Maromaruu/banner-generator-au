<div id="app-root"></div>
<style>
  :root {
    --ink: #ecedf3;
    --paper: #141418;
    --line: #2b2c33;
    --input-line: #35363e;
    --accent: #8fa8ff;
    --accent-foreground: #121212;
    --secondary: #dbf184;
    --secondary-foreground: #121212;
    --success: #22c55e;
    --card: #18181b;
    --card-foreground: #ffffff;
    --muted: #222228;
    --muted-foreground: #a1a2ad;
    --radius-lg: 1.5rem;
    --radius-md: 1.125rem;
    --radius-sm: 0.875rem;
    --shadow-sm: 0px 4px 10px 0px rgba(0,0,0,0.10), 0px 1px 2px -1px rgba(0,0,0,0.10);
    --sans: 'Geist', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  #app-root {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    padding: 28px 28px 84px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 1080px; width: 100%; margin: 0 auto; }
  .head { display: flex; align-items: stretch; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 20; background: var(--paper); padding: 10px 0; }
  .head span { display: inline-flex; align-items: center; }
  .page-footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--paper); border-top: 1px solid var(--line);
    padding: 10px 28px; display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: #a3a3a3; font-weight: 500;
  }
  .page-footer .made-by { display: inline-flex; align-items: center; gap: 8px; }
  .footer-logo { height: 20px; width: auto; opacity: 1; }
  .template-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .template-tabs button {
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: #1c1d22;
    font-family: var(--sans); font-weight: 800; font-size: 13.5px; letter-spacing: 0.02em; color: #b8b8bf;
    cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .template-tabs button:focus-visible, .sw-track:focus-visible, .chip:focus-visible,
  .icon-btn:focus-visible, button.gen:focus-visible, .upload-btn:focus-visible, .dl-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .template-tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-foreground); box-shadow: var(--shadow-sm); }
  .template-tabs button:hover:not(.active) { border-color: var(--accent); color: #ffffff; }
  .title-select-wrap {
    position: relative; display: inline-flex; align-items: center;
    width: 340px; max-width: 100%;
    background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm); transition: border-color 0.15s ease, background 0.15s ease;
  }
  .title-select-wrap:hover { border-color: var(--accent); }
  .title-select-wrap:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .title-select {
    font-family: var(--sans); font-size: 20px; font-weight: 800; letter-spacing: 0.01em; color: var(--ink);
    border: none; background: transparent; padding: 10px 42px 10px 16px; margin: 0; cursor: pointer;
    appearance: none; -webkit-appearance: none; width: 100%;
  }
  .title-select:focus { outline: none; }
  .title-select option { background: #1c1d22; color: var(--ink); }
  .title-select-chevron {
    position: absolute; right: 14px; width: 16px; height: 16px; color: var(--muted-foreground); pointer-events: none;
  }
  .head span { font-family: var(--sans); font-size: 12px; letter-spacing: 0.04em; color: var(--muted-foreground); text-transform: uppercase; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #1c1d22; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-family: var(--sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); margin-bottom: 6px; font-weight: 600; }
  .optional-tag { text-transform: none; font-weight: 500; letter-spacing: 0; color: #8a8a8a; }
  .field input[type=text], .field input[type=password] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--input-line); border-radius: var(--radius-sm);
    font-family: var(--sans); font-size: 13px; background: var(--muted); color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field input.filled { border-color: var(--success); }
  .field select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--input-line); border-radius: var(--radius-sm);
    font-family: var(--sans); font-size: 13px; background: var(--muted); color: var(--ink); cursor: pointer;
  }
  .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 10.5px; color: var(--muted-foreground); margin-top: 5px; line-height: 1.4; }

  .search-row { display: flex; gap: 8px; align-items: stretch; }
  .search-row input { flex: 1; min-width: 0; }
  .search-row .gen { width: auto; flex: none; margin-top: 0; padding-left: 14px; padding-right: 14px; white-space: nowrap; }
  .key-fold-summary {
    font-family: var(--sans); font-size: 10px; font-weight: 600; color: var(--muted-foreground);
    text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; list-style: none; user-select: none;
  }
  .key-fold-summary::-webkit-details-marker { display: none; }
  .key-fold-summary::before { content: '▸ '; font-size: 9px; }
  .key-fold[open] .key-fold-summary::before { content: '▾ '; }
  .key-fold[open] .key-fold-summary { margin-bottom: 7px; }
  .key-info { margin-top: 7px; }
  .key-info summary {
    font-size: 10.5px; color: var(--accent); cursor: pointer; font-weight: 600; list-style: none;
  }
  .key-info summary::-webkit-details-marker { display: none; }
  .key-info summary::before { content: '▸ '; font-size: 9px; }
  .key-info[open] summary::before { content: '▾ '; }
  .key-info .hint { margin-top: 7px; }
  .hint a { color: var(--accent); }
  .size-row { display: flex; align-items: center; gap: 12px; width: 100%; flex-wrap: wrap; }
  .controls-grid { display: flex; align-items: stretch; justify-content: space-between; gap: 16px; width: 100%; flex-wrap: wrap; margin-top: auto; }
  .ctrl-left { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .ctrl-group { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
  .ctrl-actions { display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 10px; margin-left: auto; }
  .size-label { font-family: var(--sans); font-size: 10px; font-weight: 600; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; }
  .size-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 9px; border-radius: 999px; border: 1px solid #333338; background: #232326;
    font-family: var(--sans); font-size: 10.5px; font-weight: 600; color: #b8b8bf; cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-foreground); }
  .chip:hover:not(.active) { border-color: var(--accent); color: #ffffff; }
  .icon-chip { width: 34px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .icon-chip svg { width: 16px; height: 16px; }
  .align-gap { width: 6px; }
  .size-info { font-size: 10.5px; color: #b8b8bf; width: 100%; }
  .size-info a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .title-warning { font-size: 10.5px; color: #ff8a8a; line-height: 1.4; width: 100%; }
  .remember-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground); margin-top: 7px; font-weight: 500; cursor: pointer; }
  .remember-row input { margin: 0; cursor: pointer; }
  .forget-link { background: none; border: none; padding: 0; margin-top: 6px; font-family: var(--sans); font-size: 10.5px; color: #8a8a8a; text-decoration: underline; cursor: pointer; }
  .forget-link:hover { color: var(--accent); }
  .size-switch { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; padding: 6px 0 2px; }
  .sw-side {
    font-family: var(--sans); font-weight: 800; font-size: 13px; letter-spacing: 0.02em; text-transform: uppercase; color: #6f7079;
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; transition: color 0.15s ease;
  }
  .sw-side span { font-size: 9.5px; font-weight: 600; letter-spacing: 0.03em; opacity: 0.8; text-transform: none; }
  .sw-side.active { color: var(--accent); }
  .sw-side.disabled { opacity: 0.35; cursor: not-allowed; }
  .sw-track {
    flex: none; width: 58px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: #2b2c33;
    position: relative; cursor: pointer; padding: 0; transition: background 0.15s ease;
  }
  .sw-track .sw-knob {
    position: absolute; top: 2.5px; left: 3px; width: 21px; height: 21px; border-radius: 50%;
    background: var(--accent); box-shadow: var(--shadow-sm); transition: left 0.18s ease;
  }
  .sw-track.li .sw-knob { left: 32px; }
  .sw-track:disabled { opacity: 0.4; cursor: not-allowed; }
  button.gen {
    width: 100%; padding: 13px; border: none; border-radius: var(--radius-md); background: var(--accent); color: var(--accent-foreground);
    font-family: var(--sans); text-transform: uppercase; letter-spacing: 0.02em; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 4px;
    box-shadow: var(--shadow-sm);
  }
  button.gen:disabled { opacity: 0.5; cursor: wait; }
  button.gen:hover:not(:disabled) { background: #7f99f5; }
  .or-divider { text-align: center; font-size: 10.5px; color: var(--muted-foreground); margin: 10px 0; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .upload-btn {
    width: 100%; padding: 11px; border: 1.5px dashed var(--input-line); border-radius: var(--radius-md); background: var(--muted);

  }
  .upload-btn:hover { border-color: var(--accent); color: var(--ink); }
  .canvas-wrap { background: #1c1d22; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); }
  canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: var(--radius-sm); background: #333; }
  .canvas-stage { display: flex; align-items: center; justify-content: center; width: 100%; }
  .status { font-family: var(--sans); font-size: 11px; color: #b8b8bf; min-height: 16px; text-align: center; }
  .status.error { color: #ff8a8a; }

  .img-controls { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid #333338; background: #232326; color: #e4e4e7;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:hover:not(:disabled) { background: #2d2d31; }
  .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .img-counter { font-family: var(--sans); font-size: 11px; color: #b8b8bf; min-width: 48px; text-align: center; }
  .dl-btn {
    padding: 10px 20px; border-radius: var(--radius-md); border: none; background: var(--secondary); color: var(--secondary-foreground);
    font-family: var(--sans); text-transform: uppercase; letter-spacing: 0.02em; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .dl-btn:hover:not(:disabled) { background: #cfe968; }
  .dl-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    c.lineTo(x + bl, y + h);
    c.arcTo(x, y + h, x, y + h - bl, bl);
    c.lineTo(x, y + tl);
    c.arcTo(x, y, x + tl, y, tl);
    c.closePath();
  }

  // Cover-fit an image into a rect
  function drawCover(img, x, y, w, h) {
    const scale = Math.max(w / img.width, h / img.height);
    const sw = w / scale, sh = h / scale;
    const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function loadImageEl(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('Could not load that photo (CORS or network issue).'));
      img.src = url;
    });
  }

  // Wraps text at the given font size (must already be set on ctx) into at most MAX_LINES,
  // truncating the final line with an ellipsis if it doesn't fit. Pure measuring — no drawing.
  function buildTitleLines(text) {
    const words = text.split(' ');
    let line = '';
    const lines = [];
    const lineWordCounts = [];
    let wordsInLine = 0;
    for (let n = 0; n < words.length; n++) {
      const test = line + words[n] + ' ';
      if (ctx.measureText(test).width > layout().titleMaxWidth && line !== '') {
        lines.push(line.trim());
        lineWordCounts.push(wordsInLine);
        line = words[n] + ' ';
        wordsInLine = 1;
      } else {
        line = test;
        wordsInLine++;
      }
    }
    lines.push(line.trim());
    lineWordCounts.push(wordsInLine);

    const MAX_LINES = layout().maxLines;
    let truncated = false;
    if (lines.length > MAX_LINES) {
      truncated = true;
      const kept = lines.slice(0, MAX_LINES - 1);
      const usedWords = lineWordCounts.slice(0, MAX_LINES - 1).reduce((a, b) => a + b, 0);
      const remaining = words.slice(usedWords);
      let lastLine = '';
      for (let n = 0; n < remaining.length; n++) {
        const test = (lastLine + remaining[n] + ' ').trim() + '…';
        if (ctx.measureText(test).width > layout().titleMaxWidth && lastLine !== '') break;
        lastLine += remaining[n] + ' ';
      }
      kept.push(lastLine.trim() + '…');
      lines.length = 0;
      lines.push(...kept);
    }
    return { lines: lines, truncated: truncated };
  }

  // Picks the largest size (per template) that fits the title without truncating.
  // If even the smallest size needs truncation, returns it with truncated:true.
  function chooseAutoSize(text) {
    const sizes = layout().sizes;
    const wgt = layout().titleWeight || 700;
    for (const size of sizes) {
      ctx.font = wgt + ' ' + size + 'px Geist, sans-serif';
      const result = buildTitleLines(text);
      if (!result.truncated) return { size: size, truncated: false };
    }
    const smallest = sizes[sizes.length - 1];
    ctx.font = wgt + ' ' + smallest + 'px Geist, sans-serif';
    return { size: smallest, truncated: buildTitleLines(text).truncated };
  }

  const SIZE_LABELS = ['Small', 'Medium', 'Large', 'XL'];
  function rebuildSizeChips() {
    const asc = [...layout().sizes].sort((a, b) => a - b);
    document.querySelectorAll('.size-chips .chip[data-size]').forEach((chip, i) => {
      chip.dataset.size = asc[i];
      chip.textContent = SIZE_LABELS[i];
      chip.title = asc[i] + 'px';
    });
  }

  function refreshSizeUI() {
    const title = $('title').value.trim() || 'Your title goes here';
    let size, truncated;
    if (manualSize !== null) {
      ctx.font = (layout().titleWeight || 700) + ' ' + manualSize + 'px Geist, sans-serif';
      size = manualSize;
      truncated = buildTitleLines(title).truncated;
    } else {
      const picked = chooseAutoSize(title);
      size = picked.size;
      truncated = picked.truncated;
    }

    document.querySelectorAll('.size-chips .chip[data-size]').forEach((chip) => {
      chip.classList.toggle('active', manualSize !== null && parseInt(chip.dataset.size, 10) === manualSize);
    });
    $('autoChip').classList.toggle('active', manualSize === null);

    const warnEl = $('titleWarning');
    if (truncated) {
      warnEl.style.display = 'block';
      warnEl.textContent = manualSize !== null
        ? 'This title is too long for ' + size + 'px — it will be shortened to fit. Try a shorter title or a larger size.'
        : 'This title is long — even at the smallest size (' + Math.min.apply(null, layout().sizes) + 'px) it will be shortened to fit. Consider a shorter title.';
    } else {
      warnEl.style.display = 'none';
    }

    return size;
  }

  function redrawIfPossible() {
    if (template !== 'article') renderBanner(null);

  // Returns the x anchor for the current horizontal alignment and sets ctx.textAlign
  function titleAnchorX(areaLeft, areaRight) {
    if (titleHAlign === 'center') { ctx.textAlign = 'center'; return (areaLeft + areaRight) / 2; }
    if (titleHAlign === 'right')  { ctx.textAlign = 'right';  return areaRight; }
    ctx.textAlign = 'left';
    return areaLeft;
  }
  async function applyTemplate() {
    const L = layout();
    canvas.width = L.w;
    canvas.height = L.h;

    refreshSizeSwitch();
    const visible = TEMPLATE_FIELDS[template];
    ALL_FIELDS.forEach((cls) => {
      document.querySelectorAll('.' + cls).forEach((el) => {
        el.style.display = visible.indexOf(cls) !== -1 ? '' : 'none';
      });

    rebuildSizeChips();
    refreshSizeUI();
    try {
      const wgt = L.titleWeight || 700;
      await Promise.all(L.sizes.map((s) => document.fonts.load(wgt + ' ' + s + 'px Geist')));
      await Promise.all(['300 32px', '400 32px', '500 26px', '500 38px', '700 32px', '500 50px', '400 60px', '700 54px']
        .map((f) => document.fonts.load(f + ' Geist')));

  function refreshSizeSwitch() {
    const avail = TEMPLATE_SIZES[template];

  function setVariant(v) {

    templateVariant[template] = v;

  document.querySelectorAll('#templateTabs button').forEach((tab) => {
    tab.addEventListener('click', () => {

      template = tab.dataset.template;

      restoreTemplateState();

  manualSize = null;
  templateSize[template] = null;
  rebuildSizeChips();
  refreshSizeUI();
  applyTemplate();

  // One box size for every template: the LinkedIn template (the richest panel)
  // is the reference; both boxes get locked to its height, and contents
  // distribute inside it (controls flow from the top, arrows + download pinned
  // to the bottom of the right box).
  function lockBoxHeights() {
    const panel = document.querySelector('.panel');
    const wrap = document.querySelector('.canvas-wrap');
    const stage = document.querySelector('.canvas-stage');
    panel.style.minHeight = '';
    wrap.style.minHeight = '';
    stage.style.height = '';
    // the image area always keeps the tallest canvas ratio (WordPress, 1617:1080)
    // at the current width, so the chips and download button never move between
    // templates — and it stays correct whichever tab is active when resizing
    stage.style.height = Math.round(stage.getBoundingClientRect().width * 1080 / 1617) + 'px';
    const h = Math.max(panel.offsetHeight, wrap.offsetHeight);
    panel.style.minHeight = h + 'px';
    wrap.style.minHeight = h + 'px';
  }
  // measure after fonts/layout settle (the reference 'article' template is active at boot)
  setTimeout(lockBoxHeights, 350);
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(lockBoxHeights, 200);
  });


  function renderBanner(bgImg) {
    if (template === 'article') renderArticle(bgImg);
    else if (template === 'bad') renderBadInfo();
    else if (template === 'hot') renderHot();
    else if (template === 'activehot') renderActiveHot();
    else renderCurious();

  // ---- Shared footer pieces (all four templates use the same bottom strip geometry:
  // an 82px row at y=977, "Powered/Published by" + logo pill left, links right) ----

  // "Powered/Published by" pill — the label and the aunoo logo share one pill
  // (h48, r6, 13.452px side padding, 16.814px gap, logo 103.957 wide).
  // Returns the pill width.
  function drawByPill(x, centerY, opts) {
    const padX = 13.452, gap = 16.814, h = 48, logoW = 103.957;
    ctx.font = (opts.weight || 300) + ' 32px Geist, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    const tW = ctx.measureText(opts.label).width;
    const w = padX * 2 + tW + gap + logoW;
    roundRectPath(ctx, x, centerY - h / 2, w, h, 6);
    ctx.fillStyle = opts.bg;
    ctx.fill();
    if (opts.border) { ctx.strokeStyle = opts.border; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = opts.color;
    ctx.fillText(opts.label, x + padX, centerY);
    const lh = logoW / (410.95 / 77.26);
    ctx.drawImage(opts.dark ? logoImgDark : logoImg, x + padX + tW + gap, centerY - lh / 2, logoW, lh);
    return w;
  }

  // "aunoo.ai · saas.aunoo.ai", right-aligned with an 8px end pad and 10px gaps
  function drawFooterLinks(rightEdge, centerY, color, dotColor) {
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '400 32px Geist, sans-serif';
    ctx.fillStyle = color;
    ctx.fillText('aunoo.ai', rightEdge - 8, centerY);
    ctx.textAlign = 'left';
  }

  // Simple wrapper for non-title text (Curious.ai subtitle): wraps at maxW,
  // clamps to maxLines with an ellipsis. Font must already be set on ctx.
  function wrapText(text, maxW, maxLines) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (let n = 0; n < words.length; n++) {
      const test = line + words[n] + ' ';
      if (ctx.measureText(test).width > maxW && line !== '') {
        lines.push(line.trim());
        line = words[n] + ' ';
      } else {
        line = test;
      }
    }
    lines.push(line.trim());
    if (lines.length > maxLines) {
      const kept = lines.slice(0, maxLines);
      kept[maxLines - 1] = kept[maxLines - 1] + '…';
      return kept;
    }
    return lines;
  }

  // ---- "LinkedIn Banner" — 1920×1080 per Figma node 2491:1138 ----
  // #212225 page, #fbfbfd photo card (44,48,1832×879, r32), Geist Bold title
  // (-0.04em) over the photo, Medium 38 date, pink-bordered "Topic" chip top-right,
  // footer: Powered by + dark pink-bordered pill + fixed tagline, links right.
  function renderArticle(bgImg) {
    const title = $('title').value.trim() || 'Your title goes here';
    const dateText = ($('dateField').value.trim() || defaultDate()).toUpperCase();

    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    try { ctx.letterSpacing = '-0.04em'; } catch (e) {}

    ctx.fillStyle = '#212225';
    ctx.fillRect(0, 0, W, H);

    const L = layout();
    const card = L.card;
    ctx.save();
    roundRectPath(ctx, card.x, card.y, card.w, card.h, card.r);
    ctx.fillStyle = '#fbfbfd';
    ctx.fill();
    ctx.clip();
    if (bgImg) {
      drawCover(bgImg, card.x, card.y, card.w, card.h);
    } else {
      // placeholder photo area — dark like the design's photo, so the light
      // title/date stay readable and every control previews live
      const g = ctx.createLinearGradient(card.x, card.y, card.x + card.w, card.y + card.h);
      g.addColorStop(0, '#2b2e36');
      g.addColorStop(1, '#16171b');
      ctx.fillStyle = g;
      ctx.fillRect(card.x, card.y, card.w, card.h);
      ctx.font = '500 26px Geist, sans-serif';
      ctx.fillStyle = 'rgba(243,244,248,0.4)';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('Photo placeholder — search Pexels or upload an image', card.x + 90, card.y + card.h - 56);
    }

    // optional tag/chip, top-right inside the card
    const chipText = $('chipLabel').value.trim();
    if (chipText) {
      ctx.font = '500 38px Geist, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      const tw = ctx.measureText(chipText).width;
      const chipPadX = 13.452, chipH = 62;
      const chipW = tw + chipPadX * 2;
      const chipX = card.x + card.w - 84 - chipW;
      const chipY = card.y + 60;
      roundRectPath(ctx, chipX, chipY, chipW, chipH, 6);
      ctx.fillStyle = 'rgba(33,34,37,0.3)';
      ctx.fill();
      ctx.strokeStyle = '#ce5e9c';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#f3f4f8';
      ctx.fillText(chipText, chipX + chipPadX, chipY + chipH / 2);
    }

    // date
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '500 38px Geist, sans-serif';
    ctx.fillStyle = '#f3f4f8';
    ctx.fillText(dateText, card.x + 90, card.y + 100);

    // title
    ctx.fillStyle = '#f3f4f8';
    const titleSize = refreshSizeUI();
    ctx.font = '700 ' + titleSize + 'px Geist, sans-serif';
    const lineHeight = titleSize * 1.15;
    const { lines } = buildTitleLines(title);
    const titleX = titleAnchorX(card.x + 90, card.x + 90 + L.titleMaxWidth);
    const vInset = 80;
    let startY;
    if (titleVAlign === 'top') {
      startY = card.y + 160 + vInset + lineHeight / 2;
    } else if (titleVAlign === 'bottom') {
      startY = card.y + card.h - vInset - lineHeight / 2 - (lines.length - 1) * lineHeight;
    } else {
      // the design centers the title block 570.5px below the card top
      startY = card.y + 570.5 - ((lines.length - 1) / 2) * lineHeight;
    }
    lines.forEach((l, i) => ctx.fillText(l, titleX, startY + i * lineHeight));
    ctx.restore();

    drawLinkedInFooter(L);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
  }

  function drawLinkedInFooter(L) {
    const centerY = 977 + 41;
    const grey = 'rgba(236,237,243,0.5)';
    let x = L.footerLeft;
    // dark pink-bordered pill holding "Powered by" + the light logo
    x += drawByPill(x, centerY, { bg: '#212225', border: '#ce5e9c', label: 'Powered by ', weight: 300, color: grey, dark: false }) + 12;
    ctx.font = '300 32px Geist, sans-serif';
    ctx.fillStyle = grey;
    ctx.textAlign = 'left';
    ctx.fillText('No ideology, no mythology, no Palantir pricing.', x, centerY);
    drawFooterLinks(L.footerRight, centerY, grey, 'rgba(243,244,248,0.8)');

  // ---- "Bad Information" — 1920×1080 per Figma node 2491:1000 ----
  // #ed5536 background, #212225 card with a 10% graph-paper grid, Geist Medium 38
  // "EDITION n · DATE" line, Geist Bold title (-0.04em), rotated hazard-stripe
  // sticker top-right, light logo pill + trust pill footer.
  function renderBadInfo() {
    const title = $('title').value.trim() || 'A weekly read on disinformation, coordinated influence operations, and media literacy.';
    const edition = $('editionField').value.trim() || '4';

    const W = canvas.width, H = canvas.height;

    ctx.fillStyle = '#212225';
    ctx.fill();
    ctx.clip();
    ctx.strokeStyle = 'rgba(243,244,248,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const pitch = 37.394;
    for (let gx = card.x + pitch; gx < card.x + card.w; gx += pitch) { ctx.moveTo(gx, card.y); ctx.lineTo(gx, card.y + card.h); }
    for (let gy = card.y + pitch; gy < card.y + card.h; gy += pitch) { ctx.moveTo(card.x, gy); ctx.lineTo(card.x + card.w, gy); }
    ctx.stroke();
    ctx.restore();

    // edition / date line
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '500 38px Geist, sans-serif';
    ctx.fillStyle = '#f3f4f8';

    // title

      startY = card.y + 160 + vInset + lineHeight / 2;

      startY = card.y + L.titleCenter - ((lines.length - 1) / 2) * lineHeight;

  // "BAD INFORMATION" sticker, top-right — the exported Figma asset drawn 1:1
  // at its exact design position (469×276 at 1442.81, 27; −7.67° rotation baked in)
  function drawBadSticker(L) {

  // Bottom strip on the orange background: dark "Powered by + logo" pill and
  // the trust pill on the left, dark links on the right (per node 2491:1096)
  function drawBadFooter(L) {

  // ---- "Daily Hot Topics" — 1617×1080 per Figma node 2491:1157 ----
  // #e5484d background, #e2e2ee card (44,48,1529×908, r32), calendar icon + Geist
  // Medium 50 date, Geist Medium title (-0.04em) in the left column, typewriter
  // illustration on the right (multiply blend, once the asset is embedded).
  function renderHot() {
    // the updated Figma frame has no title — it's optional here: leave the field
    // empty for the design-exact hero layout, or type one for the split layout
    const title = $('title').value.trim();
    const dateText = ($('dateField').value.trim() || defaultDate()).toUpperCase();

    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#e5484d';
    ctx.fillRect(0, 0, W, H);

    const L = layout();
    const card = L.card;
    ctx.save();
    roundRectPath(ctx, card.x, card.y, card.w, card.h, card.r);
    ctx.fillStyle = '#e2e2ee';
    ctx.fill();
    ctx.clip();

    // typewriter illustration (multiply blend):
    // no title → design-exact hero placement, centered (785×813 at 371,82);
    // with a title → the illustration steps aside to the right column
    if (hotTypewriterImg.complete && hotTypewriterImg.naturalWidth) {
      ctx.globalCompositeOperation = 'multiply';
      if (title) drawCover(hotTypewriterImg, card.x + 862, card.y + 179, 667, 690);
      else drawCover(hotTypewriterImg, card.x + 371, card.y + 82, 785.274, 813);
      ctx.globalCompositeOperation = 'source-over';
    }

    // date row: calendar icon + date
    drawHotCalendarIcon(card.x + 82, card.y + 82, 75);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '500 50px Geist, sans-serif';
    ctx.fillStyle = '#212225';
    ctx.fillText(dateText, card.x + 82 + 75 + 20, card.y + 82 + 37.5);

    // optional title — Geist Medium, dark, left column (801px wide)
    if (title) {
      ctx.fillStyle = '#212225';
      const titleSize = refreshSizeUI();
      ctx.font = '500 ' + titleSize + 'px Geist, sans-serif';
      const lineHeight = titleSize * 1.15;
      const { lines } = buildTitleLines(title);
      const titleX = titleAnchorX(card.x + 82, card.x + 82 + 801);
      const vInset = 80;
      let startY;
      if (titleVAlign === 'top') {
        startY = card.y + 190 + lineHeight / 2;
      } else if (titleVAlign === 'bottom') {
        startY = card.y + card.h - vInset - lineHeight / 2 - (lines.length - 1) * lineHeight;
      } else {
        // the design centers the title block 70px below the card center
        startY = card.y + card.h / 2 + 70 - ((lines.length - 1) / 2) * lineHeight;
      }
      lines.forEach((l, i) => ctx.fillText(l, titleX, startY + i * lineHeight));
    }
    ctx.restore();

    drawHotFooter();
    try { ctx.letterSpacing = '0px'; } catch (e) {}
  }

  // Red rounded-square calendar icon (75×75) — hand-drawn replica of the design's
  // "Scientific" icon; swapped for the exported asset if it gets embedded later.
  function drawHotCalendarIcon(x, y, s) {
    roundRectPath(ctx, x, y, s, s, 16);
    ctx.fillStyle = '#e5484d';
    ctx.fill();
    const bx = x + 14, by = y + 21, bw = s - 28, bh = s - 35;
    roundRectPath(ctx, bx, by, bw, bh, 6);
    ctx.fillStyle = '#fefefe';
    ctx.fill();
    ctx.fillStyle = '#e5484d';
    ctx.fillRect(bx + 4, by + 12, bw - 8, 3.5);
    ctx.fillStyle = '#fefefe';
    roundRectPath(ctx, x + 24, y + 13, 6.5, 15, 3.2);
    ctx.fill();
    roundRectPath(ctx, x + s - 30.5, y + 13, 6.5, 15, 3.2);
    ctx.fill();
  }

  // ---- "Active Hot Topics" — 1617×1080 per Figma node 2551:1009 ----
  // Same red page + light card + footer as Daily Hot Topics, but the card is a
  // blank stage: your uploaded image sits centered on it (multiply blend, so
  // white backgrounds melt into the card just like the typewriter does).
  function renderActiveHot() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    try { ctx.letterSpacing = '-0.04em'; } catch (e) {}

    ctx.fillStyle = '#e5484d';
    ctx.fillRect(0, 0, W, H);

    const L = layout();
    const card = L.card;
    ctx.save();
    roundRectPath(ctx, card.x, card.y, card.w, card.h, card.r);
    ctx.fillStyle = '#e2e2ee';
    ctx.fill();
    ctx.clip();

    if (activeHotImg && activeHotImg.complete && activeHotImg.naturalWidth) {
      // contain-fit, centered, with the design's 82px inset
      const pad = 82;
      const s = Math.min((card.w - pad * 2) / activeHotImg.naturalWidth, (card.h - pad * 2) / activeHotImg.naturalHeight);
      const dw = activeHotImg.naturalWidth * s, dh = activeHotImg.naturalHeight * s;
      ctx.globalCompositeOperation = 'multiply';
      ctx.drawImage(activeHotImg, card.x + (card.w - dw) / 2, card.y + (card.h - dh) / 2, dw, dh);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.font = '500 26px Geist, sans-serif';
      ctx.fillStyle = 'rgba(33,34,37,0.4)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Upload an image to place it on the card', card.x + card.w / 2, card.y + card.h / 2);
      ctx.textAlign = 'left';
    }
    ctx.restore();

    drawHotFooter();
    try { ctx.letterSpacing = '0px'; } catch (e) {}
  }

  function drawHotFooter() {
    const L = layout();
    const centerY = 977 + 41;
    // light pill holding "Powered by" + the dark logo
    drawByPill(L.footerLeft, centerY, { bg: '#e2e2ee', label: 'Powered by ', weight: 400, color: '#212225', dark: true });
    drawFooterLinks(L.footerRight, centerY, '#e2e2ee', '#f3f4f8');
  }

  // ---- "Curious.ai" — 1920×1080 per Figma node 2491:1542 ----
  // #3e63dd page with a 20% graph grid, #212225 card, "EDITION n • DATE" header
  // with the curious.ai logotype right, green tagline chip, Geist Bold title +
  // Regular 60 subtitle (-0.04em), "Published by" footer.
  function renderCurious() {
    const title = $('title').value.trim() || 'America gets an open frontier model.';
    const subtitle = $('subtitleField').value.trim() || 'Plus: your subtitle goes here.';
    const tagline = ($('tagline').value.trim() || 'OPEN WEIGHTS').toUpperCase();
    const edition = $('editionField').value.trim() || '4';
    const dateText = ($('dateField').value.trim() || defaultDate()).toUpperCase();

    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    try { ctx.letterSpacing = '-0.04em'; } catch (e) {}

    // blue page with the full-bleed graph grid
    ctx.fillStyle = '#3e63dd';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(243,244,248,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const pitch = 38.788;
    for (let gx = pitch; gx < W; gx += pitch) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (let gy = pitch; gy < H; gy += pitch) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();

    // dark card
    const card = { x: 44, y: 48, w: 1832, h: 908, r: 32 };
    roundRectPath(ctx, card.x, card.y, card.w, card.h, card.r);
    ctx.fillStyle = '#212225';
    ctx.fill();

    // header row: edition/date left, curious.ai logotype right
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const headerY = card.y + 84.5;
    ctx.font = '500 38px Geist, sans-serif';
    ctx.fillStyle = '#f3f4f8';
    ctx.fillText('EDITION ' + edition + ' \u2022 ' + dateText, card.x + 83.5, headerY);

    ctx.font = '700 53.179px Geist, sans-serif';
    const wc = ctx.measureText('curious').width;
    const wdot = ctx.measureText('.').width;
    const wai = ctx.measureText('ai').width;
    let lx = card.x + 83.5 + 1665 - (wc + wdot + wai);
    ctx.fillStyle = '#f3f4f8';
    ctx.fillText('curious', lx, headerY); lx += wc;
    ctx.fillStyle = '#3e63dd';
    ctx.fillText('.', lx, headerY); lx += wdot;
    ctx.fillStyle = '#f3f4f8';
    ctx.fillText('ai', lx, headerY);

    // green tagline chip
    ctx.font = '500 50px Geist, sans-serif';
    const tw = ctx.measureText(tagline).width;
    const chipX = card.x + 82, chipY = card.y + 301, chipH = 69, chipPadX = 8;
    roundRectPath(ctx, chipX, chipY, tw + chipPadX * 2, chipH, 6);
    ctx.fillStyle = '#73ec71';
    ctx.fill();
    ctx.fillStyle = '#212225';
    ctx.textAlign = 'left';
    ctx.fillText(tagline, chipX + chipPadX, chipY + chipH / 2 + 2);

    // title (top-anchored at the design position) + subtitle
    ctx.fillStyle = '#f3f4f8';
    const titleSize = refreshSizeUI();
    ctx.font = '700 ' + titleSize + 'px Geist, sans-serif';
    const lineHeight = titleSize * 1.15;
    const { lines } = buildTitleLines(title);
    const titleX = titleAnchorX(card.x + 82, card.x + 82 + 1665);
    const titleTop = card.y + 448;
    lines.forEach((l, i) => ctx.fillText(l, titleX, titleTop + i * lineHeight + lineHeight / 2));

    ctx.font = '400 60px Geist, sans-serif';
    const subLH = 60 * 1.15;
    const subLines = wrapText(subtitle, 1665, 3);
    const subTop = titleTop + lines.length * lineHeight + 23;
    subLines.forEach((l, i) => ctx.fillText(l, titleX, subTop + i * subLH + subLH / 2));

    drawCuriousFooter();
    try { ctx.letterSpacing = '0px'; } catch (e) {}
  }

  function drawCuriousFooter() {
    const L = layout();
    const centerY = 977 + 41;
    // light pill holding "Published by" + the dark logo
    drawByPill(L.footerLeft, centerY, { bg: '#ecedf2', label: 'Published by ', weight: 400, color: '#212225', dark: true });
    drawFooterLinks(L.footerRight, centerY, '#f3f4f8');
  }

  async function showIndex(idx) {
    currentIndex = idx;
    updateCounter();
    setStatus('Loading image…');
    try {
      if (!imageCache[idx]) {
        const url = results[idx].src.large2x || results[idx].src.large;
        imageCache[idx] = await loadImageEl(url);
      }
      try {
        await Promise.all(layout().sizes.map((s) => document.fonts.load('700 ' + s + 'px Geist')));
        await document.fonts.load('500 16px Geist');
        await document.fonts.ready;
      } catch (e) {}
      renderBanner(imageCache[idx]);
      setStatus('Photo by ' + (results[idx].photographer || 'Pexels contributor') + ' via Pexels.');
      $('dlBtn').disabled = false;
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  async function search(newPage) {
    const key = $('apiKey').value.trim();
    const query = $('searchTerm').value.trim() || 'global network data';
    if (!key) { setStatus('Add your Pexels API key first.', true); return; }
    persistKeyIfNeeded();

    $('genBtn').disabled = true;
    $('refreshBtn').disabled = true;
    setStatus('Searching Pexels…');

    try {
      const res = await fetch('https://api.pexels.com/v1/search?query=' + encodeURIComponent(query) + '&per_page=12&page=' + newPage + '&orientation=' + layout().orientation, {
        headers: { Authorization: key }
      });
      if (!res.ok) throw new Error('Pexels request failed (' + res.status + '). Check your API key.');
      const data = await res.json();
      if (!data.photos || data.photos.length === 0) throw new Error('No photos found for "' + query + '". Try a different search term.');

      results = data.photos;
      imageCache = {};
      currentPage = newPage;
      setControlsEnabled(true);
      await showIndex(0);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      $('genBtn').disabled = false;
      $('refreshBtn').disabled = false;
    }
  }

  // Active Hot Topics keeps its own uploaded image, separate from the
  // LinkedIn Banner's photo pipeline
  let activeHotImg = null;

  async function handleUpload(file) {
    setStatus('Loading your image…');
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read that file.'));
        reader.readAsDataURL(file);
      });
      const img = await loadImageEl(dataUrl);
      if (template === 'activehot') {
        activeHotImg = img;
        renderBanner(null);
        setStatus('Using your uploaded image.');
        $('dlBtn').disabled = false;
        return;
      }
      results = [{ photographer: 'your uploaded image' }];
      imageCache = { 0: img };
      currentIndex = 0;
      currentPage = 1;
      setControlsEnabled(true);
      updateCounter();
      try {
        await Promise.all(layout().sizes.map((s) => document.fonts.load('700 ' + s + 'px Geist')));
        await document.fonts.load('500 16px Geist');
        await document.fonts.ready;
      } catch (e) {}
      renderBanner(img);
      setStatus('Using your uploaded image.');
      $('dlBtn').disabled = false;
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  $('uploadBtn').addEventListener('click', () => $('uploadInput').click());
  $('uploadInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleUpload(file);
  });

  $('genBtn').addEventListener('click', () => search(1));
  $('refreshBtn').addEventListener('click', () => search(currentPage + 1));
  $('prevBtn').addEventListener('click', () => {
    if (!results.length) return;
    showIndex((currentIndex - 1 + results.length) % results.length);
  });
  $('nextBtn').addEventListener('click', () => {
    if (!results.length) return;
    showIndex((currentIndex + 1) % results.length);
  });
  $('dlBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = layout().file;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
})();
</script>
